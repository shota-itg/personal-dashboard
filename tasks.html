<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tasks</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <h1>予定・締切管理</h1>
  </header>

  <main class="task-page">
    <section class="card">
      <div class="card-header">
        <h2>予定を追加</h2>
        <a href="index.html" class="text-link">トップへ戻る</a>
      </div>

      <form id="taskForm" class="task-form">
        <input type="hidden" id="taskId" />

        <div class="form-row">
          <label for="taskTitle">タイトル</label>
          <input type="text" id="taskTitle" required placeholder="例：進捗報告スライド作成" />
        </div>

        <div class="form-row">
          <label for="taskLocation">場所</label>
          <input
            type="text"
            id="taskLocation"
            placeholder="例：研究室、オンライン、〇〇駅周辺"
          />
        </div>

        <div class="form-row">
          <label for="taskCategory">カテゴリ</label>
          <select id="taskCategory">
            <option value="締切">締切</option>
            <option value="研究">研究</option>
            <option value="授業">授業</option>
            <option value="就活">就活</option>
            <option value="私用">私用</option>
            <option value="その他">その他</option>
          </select>
        </div>

        <div class="form-row form-row-inline">
          <label for="taskIsAllDay">終日</label>
          <input type="checkbox" id="taskIsAllDay" />
        </div>

        <div class="time-grid">
          <div class="form-row">
            <label for="taskStartDate">開始日</label>
            <input type="date" id="taskStartDate" required />
          </div>

          <div class="form-row">
            <label for="taskStartTime">開始時刻</label>
            <input type="time" id="taskStartTime" />
          </div>

          <div class="form-row">
            <label for="taskEndDate">終了日</label>
            <input type="date" id="taskEndDate" required />
          </div>

          <div class="form-row">
            <label for="taskEndTime">終了時刻</label>
            <input type="time" id="taskEndTime" />
          </div>
        </div>

        <div class="travel-grid">
          <div class="form-row">
            <label for="taskTravelMode">移動手段</label>
            <select id="taskTravelMode">
              <option value="none">なし</option>
              <option value="walk">徒歩</option>
              <option value="train">電車</option>
              <option value="car">車</option>
            </select>
          </div>

          <div class="form-row">
            <label for="taskTravelTime">移動時間</label>
            <select id="taskTravelTime">
              <option value="0">なし</option>
              <option value="5">5分</option>
              <option value="10">10分</option>
              <option value="15">15分</option>
              <option value="30">30分</option>
              <option value="45">45分</option>
              <option value="60">60分</option>
              <option value="90">90分</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <label for="taskImportance">重要度 自動判定</label>
          <select id="taskImportance" disabled>
            <option value="5">5：高い</option>
            <option value="4">4</option>
            <option value="3">3：普通</option>
            <option value="2">2</option>
            <option value="1">1：低い</option>
          </select>
        </div>

        <div class="form-row">
          <label for="taskMemo">メモ</label>
          <textarea
            id="taskMemo"
            rows="4"
            placeholder="補足情報や準備することなど"
          ></textarea>
        </div>

        <div class="form-actions">
          <button type="submit" id="submitButton">追加する</button>
          <button type="button" id="cancelEditButton" class="secondary-button">編集をキャンセル</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>予定・締切一覧</h2>
      <ul class="task-list" id="taskList"></ul>
    </section>
  </main>

  <script src="js/tasks.js"></script>
  <script src="js/tasks-page.js"></script>
</body>
</html>
